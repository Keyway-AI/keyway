# golangci-lint configuration for Keyway
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - bodyclose
    - unconvert
    - unparam
    - nolintlint

linters-settings:
  goimports:
    local-prefixes: github.com/architsharma/keyway
  revive:
    rules:
      - name: exported
        disabled: false
  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files may use dot-imports and long lines freely.
    - path: _test\.go
      linters:
        - unparam
        - gocritic
  max-issues-per-linter: 0
  max-same-issues: 0
