apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: reports, namespace: prod }
spec:
  selector: { matchLabels: { app: reports } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["reports"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: reports-dept, namespace: prod }
spec:
  selector: { matchLabels: { app: reports } }
  rules:
    - when:
        - key: request.auth.claims[dept]
          values: ["legal"]
