# Local development environment for Keyway.
#   make dev-up   -> start
#   make dev-down -> stop
#
# Provides Postgres (Keyway's own store) and a reference Keycloak that the
# benchmark corpus and the reference scenario point at.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keyway
      POSTGRES_PASSWORD: keyway
      POSTGRES_DB: keyway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyway"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
