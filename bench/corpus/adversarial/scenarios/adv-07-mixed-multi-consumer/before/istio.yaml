apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: svc-a, namespace: prod, labels: { team: alpha } }
spec:
  selector: { matchLabels: { app: svc-a } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["svc-a"]
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: svc-b, namespace: prod }
spec:
  selector: { matchLabels: { app: svc-b } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["svc-b"]
