http_filters:
  - name: envoy.filters.http.jwt_authn
    typed_config:
      providers:
        edge2:
          issuer: "https://idp.new/realms/main"
          audiences: ["edge2"]
          remote_jwks:
            http_uri:
              uri: "https://idp.new/realms/main/protocol/openid-connect/certs"
            cache_duration: "300s"
