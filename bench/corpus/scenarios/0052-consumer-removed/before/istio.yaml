apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: api-a, namespace: prod }
spec:
  selector: { matchLabels: { app: api-a } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["api-a"]
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: legacy-api, namespace: prod }
spec:
  selector: { matchLabels: { app: legacy-api } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["legacy-api"]
