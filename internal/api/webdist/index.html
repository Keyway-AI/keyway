    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is
      // the default (matching the dayotter design language).
      (function () {
        try {
          var t = localStorage.getItem("keyway.theme") || "light";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
