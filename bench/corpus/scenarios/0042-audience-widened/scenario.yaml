# Reference benchmark scenario (PRD §13.1). A true positive: an audience is added
# to a consumer's contract, which Keyway must detect and classify as `widened`.
id: "0042"
name: audience-widened
compose: docker-compose.yaml
issuer: { type: keycloak, realm: bench }
consumers:
  - stable_id: "k8s://bench/default/api-a"
    expects:
      issuers: ["http://kc:8080/realms/bench"]
      audiences: ["api-a"]
      algorithms: ["RS256"]
mutation:
  target: "k8s://bench/default/api-a"
  field: expects.audiences
  operation: add
  value: "api-b"
expected:
  detected: true
  class: widened
  severity: medium
  consumer: "k8s://bench/default/api-a"
