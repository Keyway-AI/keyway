http_filters:
  - name: envoy.filters.http.jwt_authn
    typed_config:
      providers:
        gateway:
          issuer: "https://kc/realms/main"
          audiences: ["gw"]
          forward: false
          payload_in_metadata: "jwt_payload"
          remote_jwks:
            http_uri:
              uri: "https://kc/realms/main/protocol/openid-connect/certs"
              timeout: "10s"
            cache_duration: "300s"
