apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: payments-api
  namespace: prod
  labels:
    team: team-payments
spec:
  selector:
    matchLabels:
      app: payments-api
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["payments-api"]
      jwksUri: "https://kc/realms/main/protocol/openid-connect/certs"
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: orders-api
  namespace: prod
  labels:
    owner: team-orders
spec:
  selector:
    matchLabels:
      app: orders-api
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["orders-api"]
      jwksUri: "https://kc/realms/main/protocol/openid-connect/certs"
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: legacy-reporting
  namespace: data
spec:
  selector:
    matchLabels:
      app: legacy-reporting
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["legacy-reporting"]
