# Same JWT contract as `before`, but a noisy redeploy churned everything around it:
#   - audiences reordered (set semantics -> identical contract)
#   - replicas 3 -> 5
#   - team label renamed alpha -> gamma
#   - image tag bumped 1.4.2 -> 1.5.0
#   - a new env var added
#   - comments added
# None of this touches issuer/audience/algorithm/claims/JWKS behaviour.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: api-a
  namespace: prod
  labels:
    team: team-gamma
spec:
  selector:
    matchLabels:
      app: api-a
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["api-shared", "api-a"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-a
  namespace: prod
spec:
  selector:
    app: api-a
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-a
  namespace: prod
  labels:
    team: team-gamma
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api-a
  template:
    metadata:
      labels:
        app: api-a
    spec:
      containers:
        - name: app
          image: registry.internal/api-a:1.5.0
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: FEATURE_FLAG_X
              value: "true"
