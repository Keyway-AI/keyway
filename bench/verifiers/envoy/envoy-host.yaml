# Envoy jwt_authn target for the eval run with the issuer on the HOST (not compose).
# Fetches JWKS from host.docker.internal:8099 (Docker Desktop host alias), requires
# iss=http://localhost:8099 + aud=rs-A + RS256, and returns 200 (direct_response) when a
# token passes. Every attack token must get 401/403; a 200 is a finding.
# Run: docker run --rm -p 10007:10007 -v "$PWD/bench/verifiers/envoy/envoy-host.yaml:/etc/envoy/envoy.yaml:ro" envoyproxy/envoy:v1.31-latest
static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10007 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                route_config:
                  name: local
                  virtual_hosts:
                    - name: rs_a
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "ok" }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keyway:
                          issuer: "http://localhost:8099"
                          audiences: ["rs-A"]
                          forward: false
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          remote_jwks:
                            http_uri:
                              uri: "http://host.docker.internal:8099/.well-known/jwks.json"
                              cluster: keyway_issuer
                              timeout: 5s
                            cache_duration: 300s
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: keyway }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: keyway_issuer
      connect_timeout: 2s
      type: STRICT_DNS
      load_assignment:
        cluster_name: keyway_issuer
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 8099 }
