apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: reports-api, namespace: prod }
spec:
  selector: { matchLabels: { app: reports-api } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["reports-api"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: reports-require-dept, namespace: prod }
spec:
  selector: { matchLabels: { app: reports-api } }
  rules:
    - when:
        - key: request.auth.claims[dept]
          values: ["finance"]
