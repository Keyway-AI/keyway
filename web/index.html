<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a8f5f" />
    <link rel="canonical" href="https://keywayhq.com/" />

    <title>Keyway — Verify your token contracts</title>
    <meta
      name="description"
      content="Open-source tool to discover, version, and adversarially test JWT and AI-agent (OAuth/MCP) authorization contracts — before you rotate a key or ship an agent."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keyway" />
    <meta property="og:url" content="https://keywayhq.com/" />
    <meta property="og:title" content="Keyway — Verify your token contracts" />
    <meta
      property="og:description"
      content="Open-source JWT & AI-agent authorization — discovered, versioned, and adversarially tested before you ship."
    />
    <meta property="og:image" content="https://keywayhq.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keyway — Verify your token contracts" />
    <meta
      name="twitter:description"
      content="Open-source JWT & AI-agent authorization — discovered, versioned, and adversarially tested before you ship."
    />
    <meta name="twitter:image" content="https://keywayhq.com/og.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is
      // the default (matching the dayotter design language).
      (function () {
        try {
          var t = localStorage.getItem("keyway.theme") || "light";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
