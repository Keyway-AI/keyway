apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: prod
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: prod
  labels:
    team: team-payments
spec:
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      serviceAccountName: payments-api-sa
      containers:
        - name: app
          ports:
            - containerPort: 8080
          env:
            - name: OIDC_ISSUER_URL
              value: "https://kc/realms/main"
            - name: OIDC_AUDIENCE
              value: "payments-api"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: prod
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: prod
  labels:
    owner: team-orders
spec:
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: app
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-worker
  namespace: prod
spec:
  selector:
    app: inventory-worker
  ports:
    - name: http
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-worker
  namespace: prod
  labels:
    app.kubernetes.io/part-of: team-inventory
spec:
  selector:
    matchLabels:
      app: inventory-worker
  template:
    metadata:
      labels:
        app: inventory-worker
    spec:
      serviceAccountName: inventory-sa
      containers:
        - name: app
          ports:
            - containerPort: 9090
          env:
            - name: JWT_AUDIENCE
              value: "inventory-worker"
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "inventory-worker"
                  path: token
