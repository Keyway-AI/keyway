name: OpenSSF Scorecard

# Scores the repo's supply-chain security posture (branch protection, pinned
# actions, dependency update tooling, token permissions, etc.) and publishes the
# result to the OpenSSF and the Security tab, backing the README badge.
# Scorecard requires a public repo, so the job is gated on public visibility.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "34 5 * * 1" # weekly

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
