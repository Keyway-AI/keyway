# Render Blueprint — deploy the Keyway backend (HTTP API + scheduler) with a
# managed Postgres. Near-one-click: on Render choose New > Blueprint, connect this
# repo, and approve. Secrets are generated (nothing to paste). See DEPLOY-RENDER.md.
#
# The image runs its own entrypoint (`keyway-runner serve`) — no command override,
# because the runtime image is distroless (no shell). Everything is driven by env:
# the binary self-migrates (KEYWAY_MIGRATE), discovers the real example configs baked
# into the image (KEYWAY_DISCOVERY_PATH=/seed/manifests), snapshots a genuine
# baseline immediately, and listens on Render's $PORT. It also serves the web UI at
# /, so the deployed URL is a full, live app (API + UI, same origin).
databases:
  - name: keyway-db
    plan: free # Render's free Postgres expires after 90 days — bump to a paid plan to keep it.
    postgresMajorVersion: "16"

services:
  - type: web
    name: keyway-api
    runtime: docker
    plan: free # free web services cold-start after inactivity; fine for a demo.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health # unauthenticated; returns 200 once serving
    autoDeploy: true
    envVars:
      - key: KEYWAY_DB_URL
        fromDatabase:
          name: keyway-db
          property: connectionString
      - key: KEYWAY_API_TOKEN
        generateValue: true # Render generates it; copy it from the dashboard to unlock the live API
      - key: KEYWAY_MIGRATE
        value: "true" # apply pending migrations on start (single distroless binary, no shell)
      - key: KEYWAY_DISCOVERY_PATH
        value: /seed/manifests # real example configs baked into the image
      - key: KEYWAY_SNAPSHOT_INTERVAL
        value: 1h # re-discover on this interval; the first snapshot runs immediately
