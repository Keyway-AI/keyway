name: Release

on:
  push:
    # Full semver tags only (vX.Y.Z, incl. -rc.N). This is a glob, not a regex:
    # "v*.*.*" needs two dots, so the moving major pointer the GitHub Action uses
    # (`v0`, no dots) never fires a duplicate release.
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          out="keyway_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$out"
          go build -ldflags "-s -w -X github.com/Keyway-AI/keyway/internal/version.Version=${VERSION}" \
            -o "dist/$out/keyway" ./cmd/keyway
          go build -ldflags "-s -w -X github.com/Keyway-AI/keyway/internal/version.Version=${VERSION}" \
            -o "dist/$out/keyway-runner" ./cmd/keyway-runner
          tar -czf "dist/${out}.tar.gz" -C "dist/$out" .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/keyway_${{ github.ref_name }}_sbom.spdx.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/keyway_${{ github.ref_name }}_sbom.spdx.json
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: Build, push & sign container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/keyway-ai/keyway:${{ github.ref_name }}
            ghcr.io/keyway-ai/keyway:latest
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/keyway-ai/keyway@${DIGEST}"
