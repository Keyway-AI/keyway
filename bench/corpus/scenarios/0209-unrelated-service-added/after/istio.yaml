apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: api-a, namespace: prod }
spec:
  selector: { matchLabels: { app: api-a } }
  jwtRules:
    - issuer: "https://kc/realms/main"
      audiences: ["api-a"]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: api-a-tuning, namespace: prod }
data:
  MAX_CONNS: "256"
---
apiVersion: v1
kind: Service
metadata: { name: api-a-metrics, namespace: prod }
spec:
  selector: { app: api-a }
  ports:
    - name: metrics
      port: 9090
