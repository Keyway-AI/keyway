name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          out="keyway_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$out"
          go build -ldflags "-s -w -X github.com/nometria/keyway/internal/version.Version=${VERSION}" \
            -o "dist/$out/keyway" ./cmd/keyway
          go build -ldflags "-s -w -X github.com/nometria/keyway/internal/version.Version=${VERSION}" \
            -o "dist/$out/keyway-runner" ./cmd/keyway-runner
          tar -czf "dist/${out}.tar.gz" -C "dist/$out" .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  image:
    name: Build & push container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/nometria/keyway:${{ github.ref_name }}
            ghcr.io/nometria/keyway:latest
