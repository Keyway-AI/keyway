apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: prod
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: prod
  labels:
    team: team-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      containers:
        - name: app
          image: registry.internal/worker:2.1.0
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "info"
      volumes:
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "worker"
                  path: token
